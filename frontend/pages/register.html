<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - MyRinggit</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="page-center">
    <div class="card">
      <h1>Create Account</h1>
      <p style="text-align: center; color: var(--color-text-muted); margin-top: -0.5rem;">
        Start tracking your student finances
      </p>

      <div id="error-message" class="alert alert-error hidden"></div>
      <div id="success-message" class="alert alert-success hidden"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="university">University (optional)</label>
          <input type="text" id="university" name="university" autocomplete="organization" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn" id="register-btn">Register</button>
      </form>

      <p class="form-footer">
        Already have an account? <a href="login.html">Log in here</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
