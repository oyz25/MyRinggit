<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTPTN - MyRinggit</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">MyRinggit</div>
    <div class="navbar-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="expenses.html">Expenses</a>
      <a href="income.html">Income</a>
      <a href="ptptn.html" class="active">PTPTN</a>
      <a href="health-score.html">Health Score</a>
      <a href="badges.html">Badges</a>
      <a href="reports.html">Reports</a>
      <a href="admin.html" id="admin-nav-link" class="hidden">Admin</a>
    </div>
    <div class="navbar-actions">
      <button id="theme-toggle-btn" class="btn btn-secondary btn-small"></button>
      <button id="logout-btn" class="btn btn-secondary btn-small">Log Out</button>
    </div>
  </nav>

  <div class="page-container">
    <h1>PTPTN</h1>

    <div id="error-message" class="alert alert-error hidden"></div>

    <!-- Survival countdown -->
    <div class="countdown-card">
      <h2>Survival Countdown</h2>
      <div id="countdown-content">
        <p class="countdown-message">Loading...</p>
      </div>
    </div>

    <div class="card" style="max-width: none; margin-bottom: 1.5rem;">
      <h2 id="ptptn-form-heading" style="margin-top: 0; font-size: 1.1rem;">Add Disbursement</h2>
      <form id="ptptn-form">
        <div class="form-group">
          <label for="amount">Amount (RM)</label>
          <input type="number" id="amount" name="amount" step="0.01" min="0.01" required />
        </div>
        <div class="form-group">
          <label for="disbursement_date">Date Received</label>
          <input type="date" id="disbursement_date" name="disbursement_date" required />
        </div>
        <div class="form-group">
          <label for="remarks">Semester (optional)</label>
          <input type="text" id="remarks" name="remarks" maxlength="255" placeholder="e.g. Year 2 Semester 1" />
        </div>
        <div class="form-group">
          <label for="expected_next_date">Expected End Date (optional)</label>
          <input type="date" id="expected_next_date" name="expected_next_date" />
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="submit" class="btn" id="add-disbursement-btn" style="flex: 1;">Add Disbursement</button>
          <button type="button" class="btn btn-secondary hidden" id="cancel-disbursement-btn" style="width: auto; padding: 0.6rem 1.25rem;">Cancel</button>
        </div>
      </form>
    </div>

    <h2 style="font-size: 1.1rem;">Disbursement History</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date Received</th>
            <th>Amount (RM)</th>
            <th>Semester</th>
            <th>Expected End Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ptptn-tbody">
          <tr><td colspan="5" class="table-empty">Loading disbursements...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/ptptn.js"></script>
</body>
</html>
