<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Score - MyRinggit</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">MyRinggit</div>
    <div class="navbar-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="expenses.html">Expenses</a>
      <a href="income.html">Income</a>
      <a href="ptptn.html">PTPTN</a>
      <a href="health-score.html" class="active">Health Score</a>
      <a href="badges.html">Badges</a>
      <a href="reports.html">Reports</a>
      <a href="admin.html" id="admin-nav-link" class="hidden">Admin</a>
    </div>
    <div class="navbar-actions">
      <button id="theme-toggle-btn" class="btn btn-secondary btn-small"></button>
      <button id="logout-btn" class="btn btn-secondary btn-small">Log Out</button>
    </div>
  </nav>

  <div class="page-container">
    <h1>Financial Health Score</h1>

    <div id="error-message" class="alert alert-error hidden"></div>

    <div class="chart-card">
      <div class="health-score-info" style="background: var(--surface-alt, rgba(255,255,255,0.05)); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; color: var(--color-text-secondary, #9ca3af);">
        <strong style="color: var(--color-text, #fff);">How it's calculated:</strong>
        Savings Rate (40%) + Budget Adherence (40%) + Consistency (20%) = your weekly score out of 100.
      </div>
      <div id="health-score-container">
        <p class="countdown-message">Loading...</p>
      </div>

      <div style="margin-top: 1.25rem;">
        <button id="recalculate-btn" class="btn" style="width: auto; padding: 0.6rem 1.5rem;">Recalculate</button>
      </div>
    </div>
  </div>

  <!-- Popup for new badges -->
  <div id="notification-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="notification-modal-title">Heads up!</h2>
      <div id="notification-modal-body"></div>
      <div class="modal-actions">
        <button id="notification-modal-close" class="btn">Got it</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/health-score.js"></script>
</body>
</html>
