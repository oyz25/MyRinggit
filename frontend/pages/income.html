<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Income - MyRinggit</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">MyRinggit</div>
    <div class="navbar-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="expenses.html">Expenses</a>
      <a href="income.html" class="active">Income</a>
      <a href="ptptn.html">PTPTN</a>
      <a href="health-score.html">Health Score</a>
      <a href="badges.html">Badges</a>
      <a href="reports.html">Reports</a>
      <a href="admin.html" id="admin-nav-link" class="hidden">Admin</a>
    </div>
    <div class="navbar-actions">
      <button id="theme-toggle-btn" class="btn btn-secondary btn-small"></button>
      <button id="logout-btn" class="btn btn-secondary btn-small">Log Out</button>
    </div>
  </nav>

  <div class="page-container">
    <h1>Income</h1>

    <div id="error-message" class="alert alert-error hidden"></div>

    <div class="card" style="max-width: none; margin-bottom: 1.5rem;">
      <h2 id="income-form-heading" style="margin-top: 0; font-size: 1.1rem;">Add Income</h2>
      <form id="income-form">
        <div class="form-group">
          <label for="category">Category (optional)</label>
          <select id="category" name="category_id">
            <option value="">Loading categories...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="amount">Amount (RM)</label>
          <input type="number" id="amount" name="amount" step="0.01" min="0.01" required />
        </div>
        <div class="form-group">
          <label for="source">Source (optional)</label>
          <input type="text" id="source" name="source" maxlength="100" placeholder="e.g. PTPTN, part-time job" />
        </div>
        <div class="form-group">
          <label for="description">Description (optional)</label>
          <input type="text" id="description" name="description" maxlength="255" />
        </div>
        <div class="form-group">
          <label for="income_date">Date</label>
          <input type="date" id="income_date" name="income_date" required />
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="submit" class="btn" id="add-income-btn" style="flex: 1;">Add Income</button>
          <button type="button" class="btn btn-secondary hidden" id="cancel-income-btn" style="width: auto; padding: 0.6rem 1.25rem;">Cancel</button>
        </div>
      </form>
    </div>

    <h2 style="font-size: 1.1rem;">Your Income</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Source</th>
            <th>Description</th>
            <th>Amount (RM)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="income-tbody">
          <tr><td colspan="6" class="table-empty">Loading income...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Popup for new badges -->
  <div id="notification-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="notification-modal-title">Heads up!</h2>
      <div id="notification-modal-body"></div>
      <div class="modal-actions">
        <button id="notification-modal-close" class="btn">Got it</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/theme-toggle.js"></script>
  <script src="../js/income.js"></script>
</body>
</html>
